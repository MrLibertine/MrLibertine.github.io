<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UnityClientDemo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #080a0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #e6ecf5;
    }
    #unity-container {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #unity-canvas {
      width: 100%; height: 100%;
      background: #0b0e14;
      display: block;
      outline: none;
    }
    /* 加载层：和 Demo 内的深色 UI 保持一致，避免白屏闪一下 */
    #unity-loading-bar {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: min(320px, 60vw);
      text-align: center;
      transition: opacity .25s ease;
    }
    #unity-loading-bar .title {
      font-size: 15px; letter-spacing: .12em; color: #c8d4e6; margin-bottom: 14px;
    }
    #unity-loading-bar .track {
      height: 2px; width: 100%;
      background: rgba(255,255,255,.10);
      border-radius: 2px; overflow: hidden;
    }
    #unity-progress-bar-full {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #4d8dff, #58e0c8);
      transition: width .12s linear;
    }
    #unity-loading-bar .hint {
      margin-top: 14px; font-size: 11px; color: #5c6a80; letter-spacing: .06em;
    }
    #unity-warning {
      position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 6px; font-size: 12px; line-height: 1.6;
      background: rgba(255, 196, 87, .14); color: #ffc457;
      border: 1px solid rgba(255, 196, 87, .3);
      max-width: 90vw; display: none; z-index: 10;
    }
    #unity-warning.error {
      background: rgba(255, 92, 92, .14); color: #ff8a8a;
      border-color: rgba(255, 92, 92, .35);
    }
    /* 桌面端：底部操作提示 */
    #hint-bar {
      position: absolute; left: 0; right: 0; bottom: 10px;
      text-align: center; font-size: 11px; color: #46536a;
      pointer-events: none; letter-spacing: .05em;
    }
    @media (max-width: 720px) {
      #hint-bar { display: none; }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div class="title">正在加载 · Unity 客户端 Demo</div>
      <div class="track"><div id="unity-progress-bar-full"></div></div>
      <div class="hint">首次加载需要下载运行时，请稍候</div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <div id="hint-bar">点击画面获取键盘焦点 · 右上角全屏按钮可放大</div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      warningBanner.style.display = "block";
      warningBanner.className = type === "error" ? "error" : "";
      warningBanner.innerHTML = msg;
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/webgl.loader.js";
    var config = {
      dataUrl: buildUrl + "/webgl.data.unityweb",
      frameworkUrl: buildUrl + "/webgl.framework.js.unityweb",
      codeUrl: buildUrl + "/webgl.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "GengPeng",
      productName: "UnityClientDemo",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    // 手机上先提示横屏，竖屏体验会很难受
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.getElementsByTagName("head")[0].appendChild(meta);
      container.className = "unity-mobile";
    }

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        loadingBar.style.opacity = 0;
        setTimeout(function () { loadingBar.style.display = "none"; }, 260);
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        unityShowBanner("加载失败：" + message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
