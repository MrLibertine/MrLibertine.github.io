<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UnityClientShowcase</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #080a0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #e6ecf5;
    }
    #unity-container {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #unity-canvas {
      width: 100%; height: 100%;
      background: #0b0e14;
      display: block;
      outline: none;
    }
    /* 加载层：和画面内的深色 UI 保持一致，避免白屏闪一下 */
    #unity-loading-bar {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: min(320px, 60vw);
      text-align: center;
      transition: opacity .25s ease;
    }
    #unity-loading-bar .title {
      font-size: 15px; letter-spacing: .12em; color: #c8d4e6; margin-bottom: 14px;
    }
    #unity-loading-bar .track {
      height: 2px; width: 100%;
      background: rgba(255,255,255,.10);
      border-radius: 2px; overflow: hidden;
    }
    #unity-progress-bar-full {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #4d8dff, #58e0c8);
      transition: width .12s linear;
    }
    #unity-loading-bar .hint {
      margin-top: 14px; font-size: 11px; color: #5c6a80; letter-spacing: .06em;
    }
    #unity-warning {
      position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 6px; font-size: 12px; line-height: 1.6;
      background: rgba(255, 196, 87, .14); color: #ffc457;
      border: 1px solid rgba(255, 196, 87, .3);
      max-width: 90vw; display: none; z-index: 10;
    }
    #unity-warning.error {
      background: rgba(255, 92, 92, .14); color: #ff8a8a;
      border-color: rgba(255, 92, 92, .35);
    }
    /* 桌面端：底部操作提示 */
    #hint-bar {
      position: absolute; left: 0; right: 0; bottom: 10px;
      text-align: center; font-size: 11px; color: #46536a;
      pointer-events: none; letter-spacing: .05em;
    }
    /* 全屏按钮：嵌在博客 iframe 里时，这是唯一能放大的入口 */
    #fs-btn {
      position: absolute; right: 12px; top: 12px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      padding: 0; cursor: pointer;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(14,18,26,.72);
      color: #c8d4e6;
      backdrop-filter: blur(4px);
      transition: background .15s ease, color .15s ease, border-color .15s ease;
      z-index: 20;
    }
    #fs-btn:hover {
      background: rgba(77,141,255,.22);
      border-color: rgba(77,141,255,.55);
      color: #eaf1ff;
    }
    #fs-btn:focus-visible { outline: 2px solid #4d8dff; outline-offset: 2px; }
    #fs-btn svg { width: 16px; height: 16px; display: block; }
    @media (max-width: 720px) {
      #hint-bar { display: none; }
      #fs-btn { right: 8px; top: 8px; width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div class="title">正在加载 · Unity 客户端</div>
      <div class="track"><div id="unity-progress-bar-full"></div></div>
      <div class="hint">首次加载需要下载运行时，请稍候</div>
    </div>
    <div id="unity-warning"></div>
    <button id="fs-btn" type="button" title="全屏" aria-label="全屏">
      <svg id="fs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path>
        <path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path>
      </svg>
    </button>
  </div>
  <div id="hint-bar">点击画面获取键盘焦点 · 右上角可全屏（Esc 退出）</div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      warningBanner.style.display = "block";
      warningBanner.className = type === "error" ? "error" : "";
      warningBanner.innerHTML = msg;
    }

    // ---------- 全屏 ----------
    // 嵌在博客 iframe 里时，页面没有浏览器地址栏/标签栏，全屏按钮是唯一能放大的入口。
    // 前提：外层 iframe 必须带 allow="fullscreen"，否则浏览器会直接拒绝请求。
    var fsBtn = document.querySelector("#fs-btn");
    var fsIcon = document.querySelector("#fs-icon");
    var ICON_ENTER = '<path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path>' +
                     '<path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path>';
    var ICON_EXIT = '<path d="M9 4v5H4"></path><path d="M15 4v5h5"></path>' +
                    '<path d="M9 20v-5H4"></path><path d="M15 20v-5h5"></path>';

    function fsElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
    }

    function syncFsIcon() {
      var on = !!fsElement();
      fsIcon.innerHTML = on ? ICON_EXIT : ICON_ENTER;
      fsBtn.title = on ? "退出全屏（Esc）" : "全屏";
      fsBtn.setAttribute("aria-label", fsBtn.title);
    }

    function requestFs(el) {
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (!fn) return Promise.reject(new Error("fullscreen unsupported"));
      try {
        var r = fn.call(el);
        return r && r.then ? r : Promise.resolve();
      } catch (e) {
        return Promise.reject(e);
      }
    }

    function exitFs() {
      var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (!fn) return Promise.resolve();
      try {
        var r = fn.call(document);
        return r && r.then ? r : Promise.resolve();
      } catch (e) {
        return Promise.resolve();
      }
    }

    fsBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (fsElement()) { exitFs(); return; }
      // 先对整个文档请求；失败再退回容器（个别浏览器对 documentElement 有限制）
      requestFs(document.documentElement)
        .catch(function () { return requestFs(container); })
        .catch(function (err) {
          var reason = (err && err.name) ? err.name : "未知原因";
          unityShowBanner("全屏被浏览器拒绝了（" + reason + "）。如果是嵌在页面里，等外层 iframe 加上 allow=\"fullscreen\" 后即可；" +
                           "也可以直接在新标签页打开本页。", "warn");
        });
    });

    document.addEventListener("fullscreenchange", syncFsIcon);
    document.addEventListener("webkitfullscreenchange", syncFsIcon);
    syncFsIcon();

    var buildUrl = "Build";
    // 资源版本号：重新构建后 +1，避免访客拿到浏览器缓存的旧 data / wasm
    var BUILD_VER = "6";
    var V = "?v=" + BUILD_VER;
    var loaderUrl = buildUrl + "/webgl.loader.js" + V;
    var config = {
      dataUrl: buildUrl + "/webgl.data.unityweb" + V,
      frameworkUrl: buildUrl + "/webgl.framework.js.unityweb" + V,
      codeUrl: buildUrl + "/webgl.wasm.unityweb" + V,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "GengPeng",
      productName: "UnityClientShowcase",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    // 手机上先提示横屏，竖屏体验会很难受
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.getElementsByTagName("head")[0].appendChild(meta);
      container.className = "unity-mobile";
    }

    // WebGL 支持检测：不支持时给出明确提示，而不是让访客对着黑屏等加载
    (function () {
      var ok = false;
      try {
        var testCanvas = document.createElement("canvas");
        ok = !!(testCanvas.getContext("webgl2") || testCanvas.getContext("webgl"));
      } catch (e) { ok = false; }
      if (!ok) {
        loadingBar.style.display = "none";
        unityShowBanner("当前浏览器不支持 WebGL，无法运行该演示。请改用最新版 Chrome / Edge 打开，并确认浏览器设置里「硬件加速」没有被关闭。", "error");
        return;
      }
    })();

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        loadingBar.style.opacity = 0;
        setTimeout(function () { loadingBar.style.display = "none"; }, 260);
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        unityShowBanner("加载失败：" + message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
